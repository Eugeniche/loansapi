version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - loan-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=loans
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loan-network

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=loans
      - DB_USER=user
      - DB_PASSWORD=password
      - COOKIE_VALIDATION_KEY=jHg2hePbI2YZHlcP+N3XX6iMCF4wJyfQY0ZZwFCgL5o=
      - YII_DEBUG=true
      - YII_ENV=dev
    working_dir: /var/www/html
    command: >
      sh -c "composer install --no-interaction --optimize-autoloader &&
             php yii migrate --interactive=0 &&
             php-fpm"
    depends_on:
      - postgres
    networks:
      - loan-network

volumes:
  postgres_data:

networks:
  loan-network:
    driver: bridge